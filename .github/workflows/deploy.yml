name: Deploy Homefinder to Vercel

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            DEPLOY_URL=$(npx vercel --yes --token=$VERCEL_TOKEN --prod --confirm)
            npx vercel alias set $DEPLOY_URL devhomefinder.vercel.app --token=$VERCEL_TOKEN
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            DEPLOY_URL=$(npx vercel --yes --token=$VERCEL_TOKEN --prod --confirm)
            npx vercel alias set $DEPLOY_URL prodhomefinder.vercel.app --token=$VERCEL_TOKEN
          fi

      - name: Post-deployment cleanup
        run: |
          echo "Deployment completed successfully."
          echo "You can view the deployed site at:"
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "https://devhomefinder.vercel.app"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "https://prodhomefinder.vercel.app"
          fi